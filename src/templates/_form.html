{% macro inquiry_form(t, lang, page, preset='') -%}
{%- set f = t.form -%}
<form class="form-card" id="inquiry-form" action="{{ site.form_endpoint }}" method="post" enctype="multipart/form-data"
      data-ok="{{ f.ok }}" data-err="{{ f.err }}" data-err-files="{{ f.err_files }}" data-err-required="{{ f.err_required }}" data-sending="{{ f.sending }}" novalidate>
  <h2 class="h3">{{ f.title }}</h2>
  <p class="muted">{{ f.intro }}</p>
  <input type="hidden" name="lang" value="{{ lang }}">
  <input type="hidden" name="source_page" value="{{ page.url }}">
  <div class="hp" aria-hidden="true"><label for="f-website">Website</label><input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
  <div class="form-grid">
    <div class="field">
      <label for="f-name">{{ f.name }} <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="f-name" name="name" autocomplete="name" required aria-required="true">
    </div>
    <div class="field">
      <label for="f-company">{{ f.company }}</label>
      <input type="text" id="f-company" name="company" autocomplete="organization">
    </div>
    <div class="field">
      <label for="f-email">{{ f.email }} <span class="req" aria-hidden="true">*</span></label>
      <input type="email" id="f-email" name="email" autocomplete="email" required aria-required="true">
    </div>
    <div class="field">
      <label for="f-phone">{{ f.phone }}</label>
      <input type="tel" id="f-phone" name="phone" autocomplete="tel">
    </div>
    <div class="field">
      <label for="f-country">{{ f.country }}</label>
      <input type="text" id="f-country" name="country" autocomplete="country-name">
    </div>
    <div class="field">
      <label for="f-type">{{ f.type }}</label>
      <select id="f-type" name="inquiry_type">
        {% for o in f.type_options %}<option value="{{ o.value }}"{% if o.value == preset %} selected{% endif %}>{{ o.label }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="f-material">{{ f.material }}</label>
      <input type="text" id="f-material" name="material" aria-describedby="f-material-hint">
      <span class="hint" id="f-material-hint">{{ f.material_hint }}</span>
    </div>
    <div class="field">
      <label for="f-quantity">{{ f.quantity }}</label>
      <input type="text" id="f-quantity" name="quantity" aria-describedby="f-quantity-hint">
      <span class="hint" id="f-quantity-hint">{{ f.quantity_hint }}</span>
    </div>
    <div class="field full">
      <label for="f-message">{{ f.message }} <span class="req" aria-hidden="true">*</span></label>
      <textarea id="f-message" name="message" required aria-required="true" aria-describedby="f-message-hint"></textarea>
      <span class="hint" id="f-message-hint">{{ f.message_hint }}</span>
    </div>
    <div class="field full">
      <label for="f-files">{{ f.files }}</label>
      <input type="file" id="f-files" name="files" multiple accept=".jpg,.jpeg,.png,.webp,.heic,.pdf,image/*,application/pdf" aria-describedby="f-files-hint">
      <span class="hint" id="f-files-hint">{{ f.files_hint }}</span>
    </div>
    <div class="field full">
      <label class="check"><input type="checkbox" name="consent" value="yes" required aria-required="true"> <span>{{ f.consent|safe }}</span></label>
    </div>
    {% if site.turnstile_site_key %}<div class="field full"><div class="cf-turnstile" data-sitekey="{{ site.turnstile_site_key }}"></div></div>{% endif %}
  </div>
  <div class="form-actions">
    <button class="btn btn--primary" type="submit">{{ f.submit }}</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </div>
</form>
{% if site.turnstile_site_key %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}
{%- endmacro %}
