# Global network — rendered on /global-network/.
regions:
  - id: usa
    name: United States · IRM LLC
    tagline: North American operating arm — paired fiber processing and compounding
    sites:
      - type: Technical fiber hub
        name: South Jordan, Utah
        loc: "881 W. Baxter Dr., Suite 100, South Jordan, UT 84095 · Headquarters"
        text: >-
          Technology and innovation center. Carbon fiber oversizing — a secondary binder applied to loose
          roving and off-grade bobbins to keep bundles intact — and precision chopping from 0.1 to 12 mm.
          Powder production by the process each material needs: ambient mechanical milling for glassy
          thermosets (Vespel®, post-cured PAI, PBI, phenolic, P84), ambient jet milling after molecular-weight
          reduction for PTFE, and cryogenic grinding for drawn UHMWPE fiber and aramid. Para-aramid and UHMWPE
          pulp from ballistic PPE waste. Small-scale reactive extrusion for formulation development before
          scale-up at Sumter, SC.
        tags: [CF Oversizing, Precision Chopping, Ambient Milling, Cryo Grinding, Aramid Pulp, R&D Compounding]
      - type: Industrial plant
        name: Sumter, South Carolina
        url: /locations/sumter-sc/
        loc: "2075 Lynette Drive, Sumter, SC 29154"
        text: >-
          Large-scale production facility. High-volume collection of ballistic and technical fiber waste and
          deconstruction of end-of-life body armor and ballistic panels. Solvent and other cleaning processes
          that recover high-performance aromatic polymers and fibers, from PEEK to para-aramid. Micronization
          of PTFE and post-cured PAI. Industrial-scale reactive extrusion of PEEK, PPS, PA, LCP and
          fluoropolymer compounds, using fibers, powders and additives from South Jordan, UT — one chain from
          waste to compound pellet.
        tags: [Industrial Reactive Extrusion, Ballistic Waste, Solvent Cleaning, PTFE & PAI Micronization, Vespel® Powder, Thermoset Recycling]
      - type: Office
        name: North Charleston, South Carolina
        loc: "6650 Rivers Ave, Ste 105, PMB #245157, North Charleston, SC 29406"
        text: South Carolina office and mailing address of IRM LLC.
        tags: [Office]

